<style>
:root{--bg:#0b0d12;--bg2:#12151c;--card:rgba(255,255,255,.045);--bd:rgba(255,255,255,.09);--tx:#eef0f5;--mut:#8b91a1;--ac:#7c8cff;--ac2:#b16cff;--sh:0 10px 30px rgba(0,0,0,.35);--glow:rgba(124,140,255,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f4f5fa;--bg2:#fff;--card:rgba(255,255,255,.7);--bd:rgba(20,24,40,.09);--tx:#161a28;--mut:#6a7185;--sh:0 10px 30px rgba(30,40,80,.12);--glow:rgba(124,140,255,.25)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 15% -5%,rgba(124,140,255,.16),transparent),radial-gradient(500px 400px at 90% 10%,rgba(177,108,255,.12),transparent)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:16px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;box-shadow:0 4px 16px var(--glow);transition:transform .4s}
.brand:hover .logo{transform:rotate(-8deg) scale(1.08)}
.search{flex:1;max-width:520px;margin:0 auto;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px;outline:0;transition:.2s}
.search input:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--glow)}
.search svg{position:absolute;left:12px;top:50%;translate:0 -50%;color:var(--mut)}
.acts{display:flex;align-items:center;gap:8px}
.btn{padding:9px 14px;border-radius:10px;font-size:13px;font-weight:500;border:1px solid var(--bd);background:var(--card);transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);border-color:var(--ac)}
.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff;box-shadow:0 4px 14px var(--glow)}
.ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--bd);background:var(--card);transition:.25s}
.ic:hover{transform:translateY(-2px) rotate(15deg)}
.av{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid var(--bd);display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--card);transition:.2s}
.av:hover{border-color:var(--ac);transform:scale(1.06)}
.av.on{background:linear-gradient(135deg,#34d399,#3b82f6);color:#fff}
main{max-width:1280px;margin:0 auto;padding:28px 24px 110px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;align-items:start}
.cat{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:16px;backdrop-filter:blur(10px);animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.ch{display:flex;align-items:center;gap:6px}
.ci{font-size:20px;width:38px;height:38px;border-radius:11px;background:var(--bg2);border:1px solid var(--bd);display:grid;place-items:center;transition:.25s}
.ci:hover{transform:scale(1.12) rotate(-6deg)}
.ct{flex:1;font-weight:600;font-size:15px;padding:4px 6px;border-radius:8px;outline:0;min-width:0}
.ct:focus{background:var(--bg2);box-shadow:0 0 0 2px var(--ac)}
.cnt{font-size:12px;color:var(--mut)}
.chev{transition:transform .3s;color:var(--mut)}
.cat.closed .chev{transform:rotate(-90deg)}
.body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s}
.cat.closed .body{grid-template-rows:0fr}
.body>div{overflow:hidden}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-top:14px}
.card{position:relative;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:1px solid var(--bd);background:var(--bg2);text-decoration:none;color:inherit;transition:transform .25s cubic-bezier(.2,.8,.3,1),box-shadow .25s,border-color .25s;overflow:hidden;animation:in .4s both}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(160px circle at var(--mx,50%) var(--my,50%),var(--glow),transparent 70%);opacity:0;transition:opacity .25s;pointer-events:none}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:var(--ac)}
.card:hover::before{opacity:1}
.fav{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;position:relative;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.nm{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;font-size:11px;color:var(--mut);font-weight:400;overflow:hidden;text-overflow:ellipsis}
.dots{position:relative;z-index:2;width:26px;height:26px;border-radius:8px;color:var(--mut);opacity:0;transition:.2s;font-size:16px;line-height:1}
.card:hover .dots,.dots:focus,.dots.o{opacity:1}
.dots:hover{background:var(--card);color:var(--tx)}
@media(hover:none){.dots{opacity:1}}
.menu{position:absolute;right:8px;top:40px;z-index:5;min-width:110px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:4px;animation:in .18s both}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px}
.menu button:hover{background:var(--card)}
.menu .del{color:#f87171}
.cat.mo .body>div{overflow:visible}.card.mo{z-index:10}
.addm{grid-column:1/-1;padding:9px;border:1px dashed var(--bd);border-radius:12px;color:var(--mut);font-size:13px;transition:.2s}
.addm:hover{border-color:var(--ac);color:var(--tx)}
.web{display:flex;align-items:center;gap:10px;padding:14px 16px;margin-bottom:20px;border-radius:14px;border:1px solid var(--ac);background:var(--glow);width:100%;text-align:left;animation:in .3s both}
.empty{text-align:center;color:var(--mut);padding:60px 0}
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,7,12,.6);backdrop-filter:blur(6px);display:none;place-items:center;padding:16px}
.ov.s{display:grid;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.mod{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--bd);border-radius:20px;padding:22px;box-shadow:var(--sh);animation:pop .3s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.94)}}
.mod h3,.gbox h3{font-size:17px;margin-bottom:14px}
.mod label,.gbox label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;text-align:left}
.ipick-q{width:100%;margin-bottom:8px;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:13px;outline:0}
.ipick-q:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--glow)}
.ipick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;max-height:190px;overflow-y:auto;padding-right:2px}
.ipick-grid .ic{width:100%;aspect-ratio:1;font-size:17px}
.acct-list{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.tut-ic{width:72px;height:72px;border-radius:20px;background:var(--bg2);display:grid;place-items:center;font-size:34px;margin:0 auto 18px}
.tut-body{text-align:center;padding:4px 6px 0}
.tut-body h3{font-size:19px;margin-bottom:8px}
.tut-body p{font-size:13.5px;color:var(--mut);line-height:1.55;max-width:380px;margin:0 auto}
.tut-dots{display:flex;justify-content:center;gap:6px;margin:20px 0 2px}
.tut-dots span{width:7px;height:7px;border-radius:50%;background:var(--bd);transition:.2s}
.tut-dots span.on{background:var(--ac);width:18px;border-radius:4px}
.tut-foot{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.ver{text-align:center;font-size:11px;color:var(--mut);margin-top:16px;opacity:.7}
.btn.row{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:11px 14px}
.btn.row span{color:var(--mut);font-size:15px}
.btn.row:hover span{color:var(--ac)}
.mod input,.mod select,.gbox input,.gbox select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px;outline:0}
.mod input:focus,.mod select:focus,.gbox input:focus,.gbox select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--glow)}
.prev{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-size:13px;min-height:56px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.mod{max-height:90vh;overflow:auto}
.fav svg{width:22px;height:22px}.fav img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;font-size:14px}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:14px 0 2px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--bd)}
.err{color:#f87171;font-size:12px;min-height:16px;margin-top:8px}
.sw{font-size:13px;color:var(--mut);margin-top:14px;text-align:center}.sw a{color:var(--ac);cursor:pointer;font-weight:500}
.note{font-size:12px;color:var(--mut);line-height:1.5;margin-top:10px}
.mod input[type=file]{padding:7px;font-size:12px}
.bn{display:none}
@media(max-width:760px){
.nav{flex-wrap:wrap;padding:10px 14px;gap:10px}.search{order:3;flex:1 1 100%;max-width:none}.acts .btn{display:none}
.brand{flex:1}main{padding:18px 14px 110px}.grid{grid-template-columns:1fr}
.bn{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;justify-content:space-around;padding:8px;border-radius:20px;background:color-mix(in srgb,var(--bg2) 80%,transparent);backdrop-filter:blur(18px);border:1px solid var(--bd);box-shadow:var(--sh)}
.bn button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);padding:6px 8px;border-radius:12px;transition:.2s}
.bn button:active{transform:scale(.9);background:var(--card)}
.bn span{font-size:18px}}
/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);transition:opacity .6s ease,visibility .6s}
#splash::before{content:"";position:fixed;inset:0;background:radial-gradient(700px 500px at 20% 0%,rgba(124,140,255,.25),transparent),radial-gradient(600px 500px at 85% 100%,rgba(177,108,255,.2),transparent)}
.s-logo{position:relative;width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;box-shadow:0 12px 40px var(--glow);animation:sPop .8s cubic-bezier(.2,.9,.25,1.3) both}
.s-logo svg{width:42px;height:42px}
.s-name{position:relative;font-size:26px;font-weight:700;letter-spacing:-.02em;opacity:0;animation:sFade .6s ease .35s forwards}
.s-tag{position:relative;font-size:13px;color:var(--mut);opacity:0;animation:sFade .6s ease .55s forwards}
.s-ring{position:absolute;inset:-14px;border-radius:50%;border:2px solid transparent;border-top-color:rgba(255,255,255,.55);animation:sSpin 1.1s linear infinite}
@keyframes sPop{0%{opacity:0;transform:scale(.4) rotate(-25deg)}70%{transform:scale(1.08) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes sFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sSpin{to{transform:rotate(360deg)}}
#splash.out{opacity:0;visibility:hidden}
/* ---------- Login gate ---------- */
.gate{position:fixed;inset:0;z-index:150;display:none;place-items:center;background:var(--bg);padding:24px;overflow:auto}
.gate.show{display:grid}
.gbox{width:100%;max-width:380px;text-align:center;animation:in .4s both}
.gbox .logo{width:56px;height:56px;margin:0 auto 14px;border-radius:16px}
.gbox h2{font-size:20px;margin-bottom:6px}
.gbox p.lead{color:var(--mut);font-size:13px;margin-bottom:20px;line-height:1.5}
.gbox label,.gbox input{text-align:left}
/* ---------- Drag & drop ---------- */
.grip{cursor:grab;opacity:.5;padding:2px 4px;letter-spacing:-2px;transition:.2s}
.grip:hover{opacity:1}
.card[draggable]{cursor:grab}
.card.dragging,.cat.dragging{opacity:.35}
.mv{font-size:10px;opacity:.55}
@media(hover:none){.mv{opacity:.85}.grip{display:none}}
@media(max-width:400px){.ch{gap:3px}.dots{width:24px;height:24px;font-size:12px}}
.menu button[data-m=up],.menu button[data-m=down]{font-size:12.5px}
.card.drag-over{box-shadow:inset 2px 0 0 var(--ac)}
.card.drag-over.drag-after{box-shadow:inset -2px 0 0 var(--ac)}
.cat.drag-over{box-shadow:inset 0 2px 0 var(--ac)}
.cat.drag-over.drag-after{box-shadow:inset 0 -2px 0 var(--ac)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function bmModal(catId,edit){
  if(!S.cats.length){catModal();return}
  const b=edit?find(edit.c).items.find(i=>i.id===edit.b):null;
  const cur=edit?edit.c:(catId||S.cats[0].id);

  const pv=()=>{const u=norm(fu.value);if(!touched)ft.value=nice(u);$('#pv').innerHTML=u&&host(u)?fav(ft.value||nice(u),u,logo)+`<div><b>${esc(ft.value||nice(u))}</b><div style="color:var(--mut);font-size:12px">${esc(host(u))}</div></div>`:'<span style="color:var(--mut)">Preview appears here…</span>'};
  ft.oninput=()=>{touched=!!ft.value;pv()};fu.oninput=pv;
  $('#fl').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image(),url=URL.createObjectURL(f);im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,64,64);logo=c.toDataURL('image/png');URL.revokeObjectURL(url);pv()};im.src=url};
  $('#ai').onclick=async()=>{const u=norm(fu.value),btn=$('#ai');if(!host(u)){fu.focus();return}
    btn.disabled=true;btn.textContent='Designing icon…';
    try{const sm=window.claude&&await claude.use('sample');if(!sm)throw 0;
      const r=await sm.json(`Design a simple app-icon logo for the website "${host(u)}" (${ft.value||nice(u)}). Return ONLY JSON: {"bg":"#RRGGBB","inner":"..."}. bg = the brand's main color. inner = SVG shapes/paths markup for viewBox 0 0 24 24, mostly white, a simple geometric mark evoking the brand. No text, script, images or styles. Max 600 characters.`,{modelTier:'quick'});
      const bg=/^#[0-9a-f]{6}$/i.test(r.bg)?r.bg:'#6366f1';
      const inner=String(r.inner||'').replace(/<\s*(script|foreignObject|image|style|use)[\s\S]*?(<\/\s*\1\s*>|\/>|$)/gi,'').replace(/\son\w+\s*=/gi,' x=').slice(0,1500);
      logo='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" fill="${bg}"/>${inner}</svg>`);

  const go=()=>{const u=norm(fu.value);if(!host(u)){fu.focus();fu.style.borderColor='#f87171';return}

/* ---------- Drag & drop reordering ---------- */
let dnd=null,armCat=false;
$('#root').addEventListener('mousedown',e=>{armCat=!!e.target.closest('.grip')});
$('#root').addEventListener('dragstart',e=>{
  const card=e.target.closest('.card');
  if(card){dnd={type:'bm',catId:card.closest('.cat').dataset.c,bmId:card.dataset.b};
    e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',card.dataset.b)}catch(er){}
    setTimeout(()=>card.classList.add('dragging'),0);return}
  const cat=e.target.closest('.cat');
  if(cat){if(!armCat){e.preventDefault();return}
    dnd={type:'cat',catId:cat.dataset.c};e.dataTransfer.effectAllowed='move';
    try{e.dataTransfer.setData('text/plain',cat.dataset.c)}catch(er){}
    cat.classList.add('dragging')}
});
$('#root').addEventListener('dragover',e=>{
  if(!dnd)return;
  if(dnd.type==='bm'){
    const card=e.target.closest('.card'),items=e.target.closest('.items');
    if(!card&&!items)return;e.preventDefault();e.dataTransfer.dropEffect='move';
    document.querySelectorAll('.card.drag-over').forEach(x=>x.classList.remove('drag-over','drag-after'));
    if(card&&card.dataset.b!==dnd.bmId){const r=card.getBoundingClientRect();const after=(e.clientX-r.left)>r.width/2;card.classList.add('drag-over');card.classList.toggle('drag-after',after)}
  }else if(dnd.type==='cat'){
    const cat=e.target.closest('.cat');if(!cat)return;e.preventDefault();e.dataTransfer.dropEffect='move';
    document.querySelectorAll('.cat.drag-over').forEach(x=>x.classList.remove('drag-over','drag-after'));
    if(cat.dataset.c!==dnd.catId){const r=cat.getBoundingClientRect();const after=(e.clientY-r.top)>r.height/2;cat.classList.add('drag-over');cat.classList.toggle('drag-after',after)}
  }
});
$('#root').addEventListener('drop',e=>{
  if(!dnd)return;e.preventDefault();
  if(dnd.type==='bm'){
    const destCat=e.target.closest('.cat');if(!destCat)return dnd=null;
    const src=find(dnd.catId),item=src.items.find(i=>i.id===dnd.bmId);if(!item)return dnd=null;
    src.items=src.items.filter(i=>i.id!==dnd.bmId);
    const dest=find(destCat.dataset.c),card=e.target.closest('.card');
    let idx=dest.items.length;
    if(card&&card.dataset.b!==dnd.bmId){idx=dest.items.findIndex(i=>i.id===card.dataset.b);const r=card.getBoundingClientRect();if((e.clientX-r.left)>r.width/2)idx++}
    dest.items.splice(idx,0,item);save();render();
  }else if(dnd.type==='cat'){
    const cat=e.target.closest('.cat');if(!cat||cat.dataset.c===dnd.catId)return dnd=null;
    const from=S.cats.findIndex(c=>c.id===dnd.catId),item=S.cats[from];
    S.cats.splice(from,1);
    let idx=S.cats.findIndex(c=>c.id===cat.dataset.c);const r=cat.getBoundingClientRect();if((e.clientY-r.top)>r.height/2)idx++;
    S.cats.splice(idx,0,item);save();render();
  }
  dnd=null;
});
$('#root').addEventListener('dragend',()=>{document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over','drag-after'));dnd=null;armCat=false});

$('#root').addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-web]');
  if(e.target.closest('.menu')){
    const m=e.target.closest('button[data-m]');if(!m)return;e.preventDefault();e.stopPropagation();
    const cid=e.target.closest('.cat').dataset.c,bid=e.target.closest('.card').dataset.b;
    if(m.dataset.m==='edit'){closeMenus();bmModal(null,{c:cid,b:bid})}
    else if(m.dataset.m==='del'){const c=find(cid);c.items=c.items.filter(i=>i.id!==bid);save();closeMenus();render()}
    else{const c=find(cid),idx=c.items.findIndex(i=>i.id===bid),to=m.dataset.m==='up'?idx-1:idx+1;
      if(to>=0&&to<c.items.length){[c.items[idx],c.items[to]]=[c.items[to],c.items[idx]];save()}
      closeMenus();render()}

function wireAuthForm(container,up,onDone){
  const $$=s=>container.querySelector(s);

  const fp=$$('#fp');if(fp)fp.onclick=async()=>{const email=$$('#ae').value.trim();if(!/^\S+@\S+\.\S+$/.test(email))return er('Enter your email above first.');
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:REDIR});er(error?error.message:'Password reset email sent.')};
  const go=async()=>{const email=$$('#ae').value.trim().toLowerCase(),pw=$$('#ap').value,name=up?$$('#an').value.trim():'';er('');
    if(!/^\S+@\S+\.\S+$/.test(email))return er('Enter a valid email address.');
    if(up&&!name)return er('Please enter your name.');
    if(up&&pw.length<8)return er('Password must be at least 8 characters.');
    if(!pw)return er('Enter your password.');
    const okBtn=$$('#ok');okBtn.disabled=true;
    try{
      if(up){const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{name},emailRedirectTo:REDIR}});if(error)throw error;
        if(data.session)onDone();else container.innerHTML=`<h3>Check your inbox</h3><p class="note">We sent a confirmation link to ${esc(email)}. Confirm it, then sign in.</p><div class="mf"><button class="btn p" id="okc">OK</button></div>`,$$('#okc').onclick=()=>renderGate('in')}
      else{const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;onDone()}
    }catch(e){er(e.message||'Something went wrong.');okBtn.disabled=false}};
  $$('#ok').onclick=go;container.onkeydown=e=>{if(e.key==='Enter')go()};
}
